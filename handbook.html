<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Henchman Handbook</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="handbook" style="max-width: 820px; margin: 2rem auto;">
    <h1>Henchman Handbook</h1>
    <p><a href="index.html">Return to ordering</a></p>

    <h2>Forgotten Henchman ID</h2>
    <p>Your Henchman ID is: <canvas id="hb-id" role="img" aria-label="Henchman ID" style="vertical-align: middle;"></canvas></p>

    <h2>Crust classifications</h2>
    <div class="table-wrap"><table id="hb-crusts"></table></div>

    <h2>Topping codenames</h2>
    <div class="table-wrap"><table id="hb-toppings"></table></div>

    <h2>Lair sectors</h2>
    <div class="table-wrap"><table id="hb-sectors"></table></div>

    <h2>Requisition error codes</h2>
    <div class="table-wrap"><table id="hb-errors"></table></div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/render-id.js"></script>
  <script>
    // Builds the Handbook from data.js so it always matches the site.
    const table = (headers, rows) =>
      `<thead><tr>${headers.map((h) => `<th>${h}</th>`).join("")}</tr></thead>` +
      `<tbody>${rows.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody>`;

    drawUncopyableText(document.getElementById("hb-id"), HENCHMAN_ID, { color: "#1f1f1f" });
    document.getElementById("hb-crusts").innerHTML =
      table(["Crust", "Classification"], CRUSTS.map((c) => [c.name, c.codename]));
    document.getElementById("hb-toppings").innerHTML =
      table(["Topping", "Codename"], TOPPINGS.map((t) => [t.name, t.codename]));
    document.getElementById("hb-sectors").innerHTML =
      table(["Sector", "Location"], SECTORS.map((s) => [s.number, s.name]));
    document.getElementById("hb-errors").innerHTML =
      table(["Code", "Meaning"], Object.entries(ERROR_CODES));
  </script>
</body>
</html>
